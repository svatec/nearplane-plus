; Reprodukovatelny build firmware pre M5StickC Plus 2.
; Arduino IDE zostava podporovane, tento subor je len doplnkova vrstva.
;
;   pio run                 - build
;   pio run -t upload       - flash cez USB
;   pio device monitor      - serial 115200

[platformio]
src_dir = nearPlane

[env:m5stickc-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
; M5StickC Plus 2 ma 8 MB flash: dva 3 MB app sloty (OTA) + ~1,9 MB LittleFS
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb_ota.csv
monitor_speed = 115200
upload_speed = 1500000

; Verzie su zafixovane, aby build nepadol po vydani novej verzie kniznice.
lib_deps =
  m5stack/M5Unified@^0.2.0
  bblanchon/ArduinoJson@^7.0.0
